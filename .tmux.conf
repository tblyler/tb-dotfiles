## General configuration {

set -g default-terminal "xterm-256color"
if 'infocmp -x tmux-256color > /dev/null 2>&1' 'set -g default-terminal "tmux-256color"'
set -as terminal-overrides ",*:RGB" # advertise true color support to attached apps

setw -g xterm-keys on # tmux will generate xterm(1) -style function key sequences; these have a number included to indicate modifiers such as Shift, Alt or Ctrl.
set -s escape-time 10 # (default 500ms) Set the time in milliseconds for which tmux waits after an escape is input to determine if it is part of a function or meta key sequences.
set -sg repeat-time 600 # (default 500ms) Allow multiple commands to be entered without pressing the prefix-key again in the specified time milliseconds. Whether a key repeats may be set when it is bound using the -r flag to bind-key.  Repeat is enabled for the default keys bound to the resize-pane command.
set -s focus-events on # When enabled, focus events are requested from the terminal if supported and passed through to applications running in tmux.  Attached clients should be detached and attached again after changing this option.
set -g set-clipboard on # use OSC 52 so copy-mode yanks go to the system clipboard, even over SSH
set -s extended-keys on # pass modified keys (e.g. Shift+Enter, a newline in Claude Code) through to apps instead of collapsing them to the plain key
set -as terminal-features ',xterm*:extkeys' # the outer terminal (ghostty's xterm-ghostty) understands extended keys
set -as terminal-features ',xterm*:usstyle' # undercurl and colored underlines, used by nvim's LSP diagnostics
set -g allow-passthrough all # let apps' escape sequences (Claude Code's desktop notifications) reach ghostty, even from panes in background windows

set -g history-limit 100000 # increase the history

# edit config
bind e new-window -n "~/.tmux.conf" "\"\${EDITOR:-vim}\" ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"~/.tmux.conf sourced\""

# reload config
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

## } General configuration

## Display {

set -g base-index 1 # start window numbering at 1 -- easier on the hands
setw -g pane-base-index 1 # make pane numbering consistent with windows

setw -g automatic-rename on # rename window to reflect current program
# ...except claude, which sets its pane title to a status glyph + the conversation's topic; name the window after that
# instead, once it has (tmux defaults a pane's title to the hostname)
setw -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{&&:#{==:#{pane_current_command},claude},#{!=:#{pane_title},#{host}}},#{=/32/…:pane_title},#{pane_current_command}}}#{?pane_dead,[dead],}'

# label split panes with their title (falling back to the command when nothing set one, since tmux defaults it to the hostname);
# only shown once a window has more than one pane, as a lone pane would otherwise lose a line to it
set -g pane-border-format ' #{pane_index}: #{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}} '
set-hook -g window-layout-changed 'setw -F pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set -g renumber-windows on # renumber windows when a window is closed

setw -g mode-keys vi # vi-style bindings in copy-mode; pairs with set-clipboard for v/y select+yank
bind -T copy-mode-vi v send -X begin-selection # tmux's own vi default is Space; v is rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel # tmux's own vi default is Enter; y is unbound

set -g set-titles on # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# activity
set -g monitor-activity on
set -g visual-activity off

## Status line {

# move status line to the top
set -g status-position top
set -g status-interval 10 # redraw status line every 10 seconds

# fallback colors, used as-is if the private dracula-pro repo below isn't
# cloned/available on this machine
#
# mirrors the zsh prompt's semantics: grey for separators/meta info, purple
# for identity (session/host), green reserved for "current" state, and
# yellow/red for activity/bell so alerts don't fall back to tmux's harsh
# default reverse-video block
set -g status-style 'bg=terminal, fg=terminal'
set -g window-status-style 'bg=terminal, fg=brightblack'
set -g window-status-current-style 'bg=terminal, fg=brightgreen, bold'
set -g window-status-activity-style 'bg=terminal, fg=brightyellow, bold'
set -g window-status-bell-style 'bg=terminal, fg=brightred, bold'
set -g status-left-style 'bg=terminal, fg=brightblack'
set -g status-right-style 'bg=terminal, fg=brightblack'

# overrides the fallback colors above when available
source-file -q "$HOME/repos/dracula-pro/themes/tmux/van-helsing-protan"

set -g status-left-length 20
set -g status-left "#[fg=brightmagenta,bold][#S]#[default] > "

set -g status-right-length 100
set -g status-right "%R < %F < #[fg=brightwhite,bold]#{host_short}"

# coding agent state badge (● working, ⚠ blocked on you, ✓ done), from the @agent
# option that ~/.claude/hooks/tmux-agent-state.sh sets on its pane and window
set -g @agent_badge '#{?#{==:#{@agent},working}, ●,}#{?#{==:#{@agent},blocked}, ⚠,}#{?#{==:#{@agent},done}, ✓,}'
setw -g window-status-format '#I:#W#{E:@agent_badge}#{?window_flags,#{window_flags}, }'
setw -g window-status-current-format '#I:#W#{E:@agent_badge}#{?window_flags,#{window_flags}, }'

## } Status line

## } Display

## Navigation {

# create session
bind C-c new-session

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window/pane creation, retain PWD
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind P paste

# pick from every pane running a coding agent, across all sessions
bind a choose-tree -Z -f '#{@agent}' -F '#{?@agent,[#{@agent}] ,}#{pane_title}'

## } Navigation
