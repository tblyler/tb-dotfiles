[settings]
lockfile = true
dotfiles.root = "~/.dotfiles"

# lets config.linux.toml / config.macos.toml (in this same directory) load
# automatically based on the host OS. this
# setting alone does nothing here — it's an early-init setting read before
# config.toml itself is parsed, so the actual activation comes from
# MISE_AUTO_ENV=1 exported in .zshenv. it's declared here anyway since it
# becomes the mise default in 2027.6.0.
auto_env = true

# only resolve lockfile URLs/checksums for platforms this repo actually
# bootstraps — mise's default set also includes windows, intel macs and musl
# variants, roughly doubling mise.lock and every `mise upgrade` diff
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

# claude ships fixes often enough that the default 24h release-age cooldown
# just delays them; everything else keeps the cooldown
minimum_release_age_excludes = ["claude"]

[dotfiles]
"~/.tmux.conf" = {}
"~/.xinitrc" = {}
"~/.zprofile" = {}
"~/.zshenv" = {}
"~/.zshrc" = {}
"~/.zshrc.d" = { mode = "symlink-each" }
"~/.config/atuin" = { mode = "symlink-each" }
"~/.config/nvim" = {}
"~/.config/ripgrep" = {}

# just this one hook script, not all of ~/.claude: the rest of it (settings.json,
# sessions, plugins, the herdr-managed hook) is machine-local state. the hook
# entries that call this script live in ~/.claude/settings.json, untracked
"~/.claude/hooks/tmux-agent-state.sh" = {}

# unlike bat/atuin/ghostty, gitconfig and lazygit pull in their private
# dracula-pro theme file via their own native include/merge mechanism
# ([include] path=, LG_CONFIG_FILE) rather than filesystem symlink-each,
# so these stay plain whole-file symlinks
"~/.gitconfig" = {}
"~/.config/lazygit" = {}

# bat has no local dotfiles content of its own (just `config`) plus a
# private dracula-pro theme file mixed in below, same split as ghostty
"~/.config/bat" = { mode = "symlink-each" }
"~/.config/bat/themes/Dracula Pro (Van Helsing).tmTheme" = { source = "~/repos/dracula-pro/themes/bat/Dracula Pro (Van Helsing).tmTheme" }

# atuin's theme file lives in the private dracula-pro repo, mixed in
# alongside the public config.toml above (symlink-each)
"~/.config/atuin/themes/van-helsing.toml" = { source = "~/repos/dracula-pro/themes/atuin/van-helsing.toml" }

# dircolors sets LS_COLORS for ls/fd/grep aliases (see .zshrc.d/colors.zsh);
# entirely sourced from the private dracula-pro repo, no public half to mix in
"~/.dircolors" = { source = "~/repos/dracula-pro/themes/dircolors/van-helsing" }

# mixes the public repo's own ghostty config with the private dracula-pro
# repo's theme file, so this can't be a single whole-directory symlink
"~/.config/ghostty" = { mode = "symlink-each" }
"~/.config/ghostty/dracula_van-helsing" = { source = "~/repos/dracula-pro/themes/ghostty/van-helsing" }

# herdr has no native include/merge mechanism (unlike gitconfig/lazygit above)
# and its config.toml is a single file rather than a themes-per-file directory
# (unlike atuin/bat/ghostty above). mise's edit-block entries only apply to a
# path with no whole-file entry of its own, so config.toml gets none at all -
# it's composed entirely from two managed edit-blocks below: the public
# structural settings, and the private [theme.custom] Van Helsing colors
# sourced from the private dracula-pro repo. Neither block ever lands whole
# in this repo's git history; only config.base.toml (no colors) does.
"~/.config/herdr/config.toml/base" = { source = "~/.dotfiles/.config/herdr/config.base.toml", template = "tera" }
"~/.config/herdr/config.toml/van-helsing-theme" = { source = "~/repos/dracula-pro/themes/herdr/van-helsing.toml", template = "tera" }

# self-referential: this file lives in the directory it links, making the
# whole repo directory mise's global config dir. that covers config.toml,
# the config.<os>.toml (auto_env) and config.<hostname>.toml (MISE_ENV)
# overlays, mise.lock and the per-tool locks/ in one whole-directory symlink.
# mise's atomic lockfile writes (temp file + rename) happen inside the
# target directory, so they land in this repo instead of replacing a
# per-file symlink. inside ~/.dotfiles mise still loads this file once, as
# global config, not a second time as a project .config/mise/config.toml
"~/.config/mise" = {}

# the [dotfiles] `source = "~/repos/dracula-pro/..."` entries above (atuin,
# bat, dircolors) are a hard dependency on this repo being cloned, not an
# optional overlay: if this clone/pull fails, `mise bootstrap` halts here and
# never reaches the [dotfiles] step, so those entries' "sources do not exist"
# case is never actually hit through normal bootstrap — only if someone runs
# `mise dotfiles apply` standalone without ever running `mise bootstrap` first
[bootstrap.repos]
"~/repos/dracula-pro" = { url = "git@git.0xdad.com:tblyler/dracula-pro.git", ref = "main" }

[bootstrap.user]
# a name, not a path: mise looks it up per machine (/bin/zsh, /usr/bin/zsh, ...)
login_shell = "zsh"

# rebuilds bat's theme cache so the Van Helsing .tmTheme symlinked in above
# actually gets picked up (bat otherwise silently falls back to its default
# theme). this stays a final hook rather than a bat `postinstall` since the
# theme symlink lands in the [dotfiles] step, after tools are installed.
# then surfaces the manual steps bootstrap can't do itself — see
# [doctor.checks] below; `|| true` keeps a failing check from failing bootstrap
[bootstrap.hooks.final]
run = '''
if command -v bat > /dev/null 2>&1; then
	bat cache --build
fi

mise doctor project || true
'''

# manual setup steps bootstrap deliberately doesn't automate. `mise doctor
# project` reports them from any directory, any time, not just at the end
# of a bootstrap run. host-specific checks live in config.<hostname>.toml
[doctor.checks.gitconfig-local]
description = "~/.gitconfig.local has a [user] identity"
run = "git config --file ~/.gitconfig.local user.email"
hint = "create ~/.gitconfig.local with your [user] block (email/name/signingkey) for this machine, plus [commit] gpgsign = true once that key is set up; ~/.gitconfig deliberately carries neither so it can be shared across machines with different emails and before a key exists"

[doctor.checks.ghostty]
description = "ghostty is installed"
run = "command -v ghostty"
hint = "ghostty isn't auto-installed on Linux (no reliable official apt package) - install manually, see https://ghostty.org/docs/install/binary"
os = ["linux"]

[doctor.checks.dracula-pro]
description = "private dracula-pro theme repo is cloned"
run = "git -C ~/repos/dracula-pro rev-parse --git-dir"
hint = "run `mise bootstrap` (see [bootstrap.repos]); the bat/atuin/ghostty/herdr/dircolors/lazygit themes all come from it"

[tools]
age = "latest"
atuin = "latest"
awscli = "latest"
bat = "latest"
black = "latest"
claude = "latest"
ctop = "latest"
delta = "latest"
duckdb = "latest"
fd = "latest"
fx = "latest"
fzf = "latest"
gh = "latest"
git-lfs = "latest"
glab = "latest"
go = "latest"
"go:github.com/jeffreyc/tag" = { version = "latest", depends = ["go"] }
golangci-lint = "latest"
gron = "latest"
# regenerates zsh completions only when a new herdr version actually lands,
# instead of .zshrc.d/herdr.zsh stat-ing the binary on every shell startup
herdr = { version = "latest", postinstall = 'mkdir -p "$HOME/.zcompletions" && herdr completion zsh > "$HOME/.zcompletions/_herdr"' }
jq = "latest"
lazygit = "latest"
neovim = "latest"
node = "lts"
"npm:ccusage" = { version = "latest", depends = ["node"] }
opentofu = "latest"
pi = "latest"
pnpm = "latest"
python = "latest"
ripgrep = "latest"
rtk = "latest"
ruff = "latest"
shellcheck = "latest"
sops = "latest"
terragrunt = "latest"
tmux = "latest"
tree-sitter = "latest"
ty = "latest"
usage = "latest"
uv = "latest"
yq = "latest"
zoxide = "latest"

# global tasks: ~/.config/mise symlinks to this file's directory, so these
# `mise run` from any directory. dir is pinned to the repo since these git
# pull, bootstrap, and touch mise.lock/locks/bin/mise by relative path.
# the old zsh function names remain as aliases in .zshrc.d/dotfiles.zsh

[tasks.upgrade]
description = "Upgrade dotfiles, OS packages, mise tools and firmware"
depends = ["dotfiles:upgrade"]
dir = "{{ env.HOME }}/.dotfiles"
shell = "bash -c"
raw = true
run = '''
set -euo pipefail

case "$(uname)" in
	Darwin)
		if command -v brew &> /dev/null; then
			brew update
			brew upgrade
		fi
		;;

	Linux)
		# Flatpak (could be just about any distro)
		if command -v flatpak &> /dev/null; then
			flatpak update
		fi

		# Debian/Ubuntu
		if command -v apt &> /dev/null; then
			sudo sh -c 'apt update && apt upgrade'
		fi

		# Fedora
		if command -v dnf &> /dev/null; then
			sudo dnf upgrade
		fi

		# Arch
		if command -v yay &> /dev/null; then
			yay -Syu --devel --timeupdate
		elif command -v pacman &> /dev/null; then
			sudo pacman -Syu
		fi
		;;
esac

# mise lives in ~/.local/bin outside its own tool management, so nothing
# else updates it; bootstrap:regen below breaks when it falls behind
# upstream's install.sh
mise self-update --yes
mise install
mise run lock:prune
# mise only auto-prunes versions that `mise upgrade` replaces, but this
# installs whatever mise.lock says (often bumped on another machine), so
# old versions would otherwise pile up. prune keeps anything a tracked
# config (any project mise has loaded), tool stub or running process uses
mise prune --yes
mise run bootstrap:regen
mise outdated

if command -v fwupdmgr &> /dev/null; then
	# 2 is a valid exit code for fwupdmgr where the operation was
	# successful but did not require action
	for cmd in refresh upgrade; do
		status=0
		fwupdmgr "$cmd" || status=$?
		if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
			exit "$status"
		fi
	done
fi
'''

[tasks."dotfiles:upgrade"]
description = "Pull the dotfiles repo and apply anything out of date on this machine"
dir = "{{ env.HOME }}/.dotfiles"
shell = "bash -c"
raw = true
run = '''
set -euo pipefail

echo 'Checking if dotfiles have updates...'
git pull --rebase --quiet

# --missing reports via exit status (1 if anything differs), not output —
# it lists every entry either way
if mise bootstrap status --missing > /dev/null; then
	# nothing differs between the dotfiles repo and what's applied here
	echo 'nope! Good bye!'
	exit 0
fi

# --prune-dotfiles also removes links for entries deleted from [dotfiles],
# which a plain bootstrap leaves behind
mise bootstrap --dry-run --prune-dotfiles

while true; do
	# no stdin (EOF) counts as "no" rather than tripping set -e
	read -r -p 'apply? [y/N] ' apply || apply=''
	case "$apply" in
		y|Y|yes|YES|Yes)
			echo 'applying changes'
			mise bootstrap --yes --prune-dotfiles
			exit 0
			;;
		n|N|no|NO|No|'')
			echo 'not applying changes'
			exit 0
			;;
	esac
done
'''

# mise.lock references each per-tool lockfile directory by exact path, but
# mise never deletes the directories of versions it has upgraded past
[tasks."lock:prune"]
description = "Delete locks/ directories that mise.lock no longer references"
dir = "{{ env.HOME }}/.dotfiles/.config/mise"
shell = "bash -c"
run = '''
set -euo pipefail

for lock_dir in locks/*/*/; do
	lock_dir="${lock_dir%/}"
	if ! grep -qF "path = \"${lock_dir}\"" mise.lock; then
		echo "pruning ${lock_dir}"
		rm -rf -- "$lock_dir"
	fi
done

# drop tool directories left empty by the above
find locks -mindepth 1 -maxdepth 1 -type d -empty -delete
'''

[tasks."bootstrap:regen"]
description = "Regenerate bin/mise, the pinned mise install script for fresh machines"
dir = "{{ env.HOME }}/.dotfiles"
run = "mise generate install-script --write bin/mise"

[tasks."go:coverage"]
description = "Run go tests with coverage and print per-function totals"
dir = "{{ cwd }}"
shell = "bash -c"
run = '''
set -euo pipefail

coverage_out="$(mktemp)"
trap 'rm -f "$coverage_out"' EXIT

go test -cover -coverprofile="$coverage_out" ./...
go tool cover -func="$coverage_out"
'''
